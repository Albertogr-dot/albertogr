
<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | MiStock</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<aside>

  <h2>MiStock</h2>

  <nav>
    <a href="index.html" class="menu">Resumen</a>
    <a href="productos.html" class="menu active">Productos</a>
    <a href="ventas.html" class="menu">Ventas</a>
  </nav>

</aside>


<main>

  <header>
    <h1>Productos</h1>
    <p>Gestiona los productos de tu inventario</p>
  </header>


  <section class="acciones-productos">

    <button type="button" id="btn-anadir-producto">
      Añadir producto
    </button>

    <input
      type="search"
      id="buscador-productos"
      placeholder="Buscar productos..."
      aria-label="Buscar productos"
    >

  </section>


  <section
    class="formulario-producto"
    id="formulario-producto"
    hidden
  >

    <h3 id="titulo-formulario">Nuevo producto</h3>

    <label for="nombre-producto">Nombre del producto</label>
    <input
      type="text"
      id="nombre-producto"
      placeholder="Ej. Camiseta básica"
      maxlength="100"
    >

    <label for="precio-producto">Precio (€)</label>
    <input
      type="number"
      id="precio-producto"
      placeholder="Ej. 15"
      min="0"
      step="0.01"
    >

    <label for="stock-producto">Stock disponible</label>
    <input
      type="number"
      id="stock-producto"
      placeholder="Ej. 25"
      min="0"
      step="1"
    >

    <div class="botones-formulario">

      <button type="button" id="guardar-producto">
        Guardar producto
      </button>

      <button type="button" id="cancelar-producto">
        Cancelar
      </button>

    </div>

  </section>


  <section class="tabla-productos">

    <h3>Listado de productos</h3>

    <div class="contenedor-tabla">

      <table>

        <thead>
        <tr>
          <th>PRODUCTO</th>
          <th>PRECIO</th>
          <th>STOCK</th>
          <th>ESTADO</th>
          <th>ACCIONES</th>
        </tr>
        </thead>

        <tbody id="lista-productos"></tbody>

      </table>

    </div>

    <p id="mensaje-sin-productos" class="mensaje-vacio" hidden>
      Todavía no tienes productos registrados.
    </p>

  </section>

</main>


<script src="js/app.js"></script>

</body>

</html>
